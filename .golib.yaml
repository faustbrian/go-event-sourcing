  - module: postgres
    archive: .verification/mutation/bootstrap/postgres.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/baseline.txt
  - module: adapters/gokafka
    mode: apidiff
    path: adapters/gokafka/api/baseline.txt
  - module: adapters/gotelemetry
    mode: apidiff
    path: adapters/gotelemetry/api/baseline.txt
  - module: adapters/outbox
    mode: apidiff
    path: adapters/outbox/api/baseline.txt
  - module: adapters/queue
    mode: apidiff
    path: adapters/queue/api/baseline.txt
  - module: postgres
    mode: apidiff
    path: postgres/api/baseline.txt
operations:
- module: adapters/gokafka
