    ledger: .verification/mutation/migration-ledger.json
  - module: adapters/queue
    archive: .verification/mutation/bootstrap/adapters-queue.zip
    ledger: .verification/mutation/migration-ledger.json
  - module: postgres
    archive: .verification/mutation/bootstrap/postgres.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/baseline.txt
  - module: adapters/gokafka
    mode: apidiff
    path: adapters/gokafka/api/baseline.txt
  - module: adapters/gotelemetry
    mode: apidiff
    path: adapters/gotelemetry/api/baseline.txt
  - module: adapters/kafka
    mode: apidiff
    path: adapters/kafka/api/baseline.txt
  - module: adapters/otel
    mode: apidiff
    path: adapters/otel/api/baseline.txt
  - module: adapters/outbox
    mode: apidiff
    path: adapters/outbox/api/v3-baseline.txt
  - module: adapters/queue
    mode: apidiff
    path: adapters/queue/api/baseline.txt
  - module: postgres
    mode: apidiff
    path: postgres/api/baseline.txt
operations:
- module: .
  gate: local-test
  steps:
  - type: go-test
    packages: ["./memory"]
    run: '^Test(StoreSerializesConcurrentExpectedVersionWriters|ProjectionStoreAllowsOnlyOneConcurrentCheckpointWinner|StoreChecksCancellationAfterWaitingForWriteOwnership)$'
    race: true
    count: 1
    timeout: 2m
- module: adapters/gokafka
  gate: docs
  steps:
  - type: make
    makefile: Makefile
    target: docs
    timeout: 20m
- module: adapters/gotelemetry
